# Dependabot 已停用（2026-09-13，GenzLTD 治理行动）
# 原因：master 分支自 2026-05-27 停更，依赖升级 PR 无法有效验证
# 恢复方式：仓库恢复活跃后，将各生态 open-pull-requests-limit 改回
#   cargo: 3 / github-actions: 1 / docker: 1
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
