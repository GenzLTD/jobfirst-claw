# Dependabot 配置（2026-09-20 由 owner 指示恢复启用）
# 前史：2026-09-13 因 master 休眠（5/27 起停更）治理性停用；现按原恢复方式重开
# 注意：master 仍处休眠态，升级 PR 将主要依赖 CI + owner review 验证
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    target-branch: master
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      rust-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    target-branch: master
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    target-branch: master
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    groups:
      docker-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
