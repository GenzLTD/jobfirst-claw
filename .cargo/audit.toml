# cargo-audit configuration
# https://rustsec.org/

[advisories]
ignore = [
    # ── Live in both audit.toml and deny.toml ──────────────────────────────
    # Tracking: new ignores need a tracking issue URL reference.
    # Each entry below summarizes the corresponding rationale in deny.toml.
    # Re-evaluate both files; remove each entry once that tool's criteria are met.
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained; transitive dep awaiting upstream migration to rustls-pki-types
    "RUSTSEC-2026-0319",  # anymap2 unmaintained; no safe upgrade; still reached via matrix-sdk 0.19.1 dev-deps in zeroclaw-channels

    # ── cargo-audit reads the full Cargo.lock, so it flags advisories for
    # crates that cargo-deny (graph-aware) does not pull into the resolved
    # dependency graph. These entries are needed only in audit.toml. ──
    "RUSTSEC-2026-0253",  # lru 0.16; residual Nostr cache path is absent from cargo-deny's resolved graph; migration tracked in #9602
    "RUSTSEC-2026-0049",  # rustls-webpki CRL matching bug; 0.102.x in Cargo.lock but not in resolved graph; awaiting rumqttc upgrade
    "RUSTSEC-2026-0098",  # rustls-webpki URI name constraints; same as above
    "RUSTSEC-2026-0099",  # rustls-webpki wildcard name constraints; same as above
    "RUSTSEC-2026-0104",  # rustls-webpki CRL parsing panic; same as above

    # ── Still present in Cargo.lock though no longer in cargo-deny's resolved
    # graph (removed from deny.toml in this same PR); audit-only, tracked in
    # #8519. ──
    "RUSTSEC-2024-0429",  # glib VariantStrIter unsoundness; GTK3 stack in Cargo.lock but not resolved graph
    "RUSTSEC-2024-0411",  # gdkwayland-sys unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0412",  # gdk unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0413",  # atk unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0414",  # gdkx11-sys unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0415",  # gtk unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0416",  # atk-sys unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0417",  # gdkx11 unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0418",  # gdk-sys unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0419",  # gtk3-macros unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2024-0420",  # gtk-sys unmaintained gtk-rs GTK3 bindings; tracking #8519
    "RUSTSEC-2025-0075",  # unic-char-range unmaintained; in Cargo.lock but not resolved graph; tracking #8519
    "RUSTSEC-2025-0080",  # unic-common unmaintained; in Cargo.lock but not resolved graph; tracking #8519
    "RUSTSEC-2025-0081",  # unic-char-property unmaintained; in Cargo.lock but not resolved graph; tracking #8519
    "RUSTSEC-2025-0098",  # unic-ucd-version unmaintained; in Cargo.lock but not resolved graph; tracking #8519
    "RUSTSEC-2025-0100",  # unic-ucd-ident unmaintained; in Cargo.lock but not resolved graph; tracking #8519
    "RUSTSEC-2024-0388",  # derivative unmaintained; in Cargo.lock but not resolved graph; tracking #8519
    "RUSTSEC-2025-0141",  # bincode unmaintained (informational, no CVE); in Cargo.lock but not resolved graph; tracking #8519
    "RUSTSEC-2024-0384",  # instant unmaintained (informational); in Cargo.lock but not resolved graph; tracking #8519

    # ── Wasmtime 47.0.4 (plugins-wasmtime, non-default optional feature) ──
    # cargo-deny does not resolve this optional stack (so `cargo deny check`
    # stays green), but cargo-audit reads the full Cargo.lock and flags it.
    # The RustSec fixes all require the 48.0.x line, and moving 47 -> 48 is not
    # source-compatible: upstream's migration rewrites
    # crates/zeroclaw-plugins/src/wasi_http.rs (WASI HTTP body/poll plumbing),
    # component.rs and wasm_channel.rs, and this fork's copies of those files
    # have diverged from the revision that migration was written against.
    # Waived here pending a deliberate port of upstream zeroclaw#11253/#11475;
    # remove these entries once the plugin stack reaches wasmtime >= 48.0.4.
    "RUSTSEC-2026-0313",  # wasmtime-wasi-http: guest-driven host memory exhaustion on outgoing body write
    "RUSTSEC-2026-0314",  # wasmtime-wasi: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0315",  # wasmtime: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0316",  # wasmtime: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0320",  # wasmtime-wasi-http: panic on zero timeout
    "RUSTSEC-2026-0321",  # wasmtime-wasi: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0322",  # wasmtime-wasi: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0323",  # wasmtime-wasi: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0324",  # wasmtime-wasi: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0325",  # wasmtime: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0326",  # wasmtime: see upstream 48.0.x advisory batch
    "RUSTSEC-2026-0327",  # wasmtime: see upstream 48.0.x advisory batch

    # ── Wasmtime 47.0.4, second batch (published 2026-10-12) ──
    # Same crate, same root cause, same fix line: RustSec now asks for
    # >= 48.0.6, < 49.0.0 OR >= 49.0.3. Nothing about the 47 -> 48 port
    # changed since the block above was written, so these ride the identical
    # waiver instead of pretending the earlier batch was narrower.
    # Tracking: #85 (port the plugin wasm stack to wasmtime >= 48.0.6/49.0.3).
    "RUSTSEC-2026-0350",  # wasmtime-wasi-http: see 48.0.x advisory batch
    "RUSTSEC-2026-0351",  # wasmtime-wasi-http: see 48.0.x advisory batch
    "RUSTSEC-2026-0352",  # wasmtime-wasi: see 48.0.x advisory batch
    "RUSTSEC-2026-0353",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0354",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0355",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0356",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0357",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0358",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0359",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0361",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0362",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0363",  # wasmtime: see 48.0.x advisory batch
    "RUSTSEC-2026-0364",  # wasmtime: see 48.0.x advisory batch

    # ruzstd 0.8.3 (RUSTSEC-2026-0344, 7.5) is pinned through
    # wasmtime 47 -> object 0.39, so the 0.9.x fix cannot land until the
    # wasmtime port above does. Waiving it here keeps the two in one place
    # instead of hiding a high-severity entry behind a lockfile bump that
    # the resolver refuses to make.
    "RUSTSEC-2026-0344",  # ruzstd decompression bomb; unblocked by #85
]
